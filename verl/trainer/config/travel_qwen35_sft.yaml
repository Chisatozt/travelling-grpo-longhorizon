# Qwen3.5 TravelGym canonical-trajectory SFT.
# The input files are generated by sft/merge_travel_sft.py and contain one
# complete trajectory per JSONL row plus an assistant_train_mask.
defaults:
  - sft_trainer
  - _self_

data:
  # The task-grouped split is the authoritative SFT input.  The legacy
  # ``travel_sft_canonical.train.jsonl`` remains an audit/compatibility
  # artifact, but must not bypass the gold10 task isolation.
  train_files: sft/travel_sft_qwen35_split/train.jsonl
  val_files: sft/travel_sft_qwen35_split/val_gold10.jsonl
  # Per-GPU micro batch size for the 4B LoRA SFT run.
  micro_batch_size_per_gpu: 1
  max_length: 32768
  truncation: error
  multiturn:
    enable: true
    messages_key: messages
    tools_key: tools
    enable_thinking_key: enable_thinking
    assistant_train_mask_key: assistant_train_mask
    sample_weight_key: sample_weight
    require_assistant_train_mask: true
    train_last_assistant_only: false

model:
  partial_pretrain: Qwen/Qwen3.5-4B
  trust_remote_code: true
  enable_gradient_checkpointing: true
  lora_rank: 16
  lora_alpha: 32
  fsdp_config:
    model_dtype: bf16

# SFT uses the top-level VERL flag for packed/remove-padding inputs.
use_remove_padding: true

trainer:
  project_name: TravelGym
  experiment_name: qwen35_4b_canonical_sft
  total_epochs: 3
  logger: ['console', 'swanlab']
  validation_frequency: epoch
  save_each_epoch: true
  best_metric: masked_token_nll
  protocol_metrics_non_degraded: true
